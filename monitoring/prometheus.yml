global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'frontend-app'
    static_configs:
      - targets: ['192.168.49.2:30003']

  - job_name: 'backend-app'
    static_configs:
      - targets: ['192.168.49.2:30002']

  - job_name: 'devops-app'
    static_configs:
      - targets: ['192.168.49.2:30001']
